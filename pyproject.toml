[project]
name = "ready-gate"
version = "0.1.0"
description = "Checks a task is fit to hand to a coding agent before it is dispatched: fills what the repo can answer, asks only what a human must."
readme = "README.md"
license = { text = "MIT" }
keywords = ["coding-agents", "mcp", "github-issues", "triage", "alan"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
]
authors = [{ name = "Sirjan Singh" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
model = ["openai>=1.60.0"]
dev = ["pytest>=8.3.0", "openai>=1.60.0"]

[project.urls]
Homepage = "https://github.com/SirjanSingh/ready"
Issues = "https://github.com/SirjanSingh/ready/issues"

[project.scripts]
ready = "ready.cli:app"
ready-mcp = "ready.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ready"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]
