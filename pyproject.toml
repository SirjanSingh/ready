[project]
name = "ready-gate"
version = "0.1.0"
description = "Checks a task is fit to hand to a coding agent before it is dispatched: fills what the repo can answer, asks only what a human must."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sirjan Singh" }]
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.2.0",
    "openai>=1.60.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
ready = "ready.cli:app"
ready-mcp = "ready.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ready"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
